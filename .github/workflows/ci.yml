name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [axor-core-published]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Log trigger context
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Triggered by axor-core ${{ github.event.client_payload.version }}"

      - name: Install
        run: |
          pip install -e ".[dev]"

      # Install AFTER setup-python so it lands in the matrix interpreter, not the
      # runner default. This overrides the editable install's resolved axor-core
      # with the exact version that triggered the rebuild.
      - name: Override axor-core to triggering version
        if: github.event_name == 'repository_dispatch'
        run: |
          pip install "axor-core==${{ github.event.client_payload.version }}"

      - name: Dependency pin freshness — installed axor-core must satisfy our pin
        run: |
          pip install packaging
          python - << 'EOF'
          import pathlib, sys, tomllib
          from importlib.metadata import version
          from packaging.requirements import Requirement

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          reqs = [Requirement(r) for r in data["project"]["dependencies"]]
          core = next(r for r in reqs if r.name == "axor-core")
          installed = version("axor-core")
          if not core.specifier.contains(installed, prereleases=True):
              print(
                  f"axor-core {installed} is OUTSIDE the declared pin "
                  f"'{core.specifier}'. Bump the pin in pyproject.toml.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"OK: axor-core {installed} satisfies '{core.specifier}'")
          EOF

      - name: CLI smoke — entry point must launch
        run: |
          python -m axor_daemon start --help
          axor-daemon start --help

      - name: Run tests
        run: pytest tests/ -v --tb=short

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    permissions:
      id-token: write   # for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - << 'EOF'
          import pathlib
          import re
          import sys
          import tomllib

          ref = "${{ github.ref_name }}"
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)", ref)
          if not m:
              print(f"Tag {ref!r} must match vX.Y.Z")
              sys.exit(1)

          tag_version = m.group(1)
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          pkg_version = data["project"]["version"]

          if tag_version != pkg_version:
              print(f"Version mismatch: tag={tag_version}, pyproject={pkg_version}")
              sys.exit(1)

          print(f"Version check passed: {pkg_version}")
          EOF

      - name: Build
        run: |
          pip install hatchling build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
