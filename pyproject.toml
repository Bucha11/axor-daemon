[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-daemon"
version = "0.3.0"
description = "Process-isolated capability executor for axor-core"
readme = {file = "README.md", content-type = "text/markdown"}
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["agents", "governance", "llm", "ai", "security"]
dependencies = [
    "axor-core>=0.9,<0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
axor-daemon = "axor_daemon.__main__:main"

[project.urls]
Repository = "https://github.com/Bucha11/axor-daemon"

[tool.hatch.build.targets.wheel]
packages = ["axor_daemon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
